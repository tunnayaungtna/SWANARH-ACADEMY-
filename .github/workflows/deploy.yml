name: Deploy SwanArh Classroom to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble production static site
        run: |
          mkdir -p dist/gh-pages dist/assets
          cp -r public/* dist/ 2>/dev/null || true
          cp -r gh-pages/* dist/gh-pages/ 2>/dev/null || true
          cp gh-pages/app.js dist/assets/app.js 2>/dev/null || true
          cp gh-pages/app.css dist/assets/app.css 2>/dev/null || true
          cp index.html dist/index.html
          cp index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

