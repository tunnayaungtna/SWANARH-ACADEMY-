    <script>
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaDeferredPrompt = null;
        window.dispatchEvent(new Event('pwa-installed'));
      });

      // Clean up legacy caches & competing service workers asynchronously after load
      window.addEventListener('load', function () {
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              if (key !== 'swanarh-classroom-v6') {
                caches.delete(key).catch(function () {});
              }
            });
          }).catch(function () {});
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (reg) {
              if (reg.active && reg.active.scriptURL && reg.active.scriptURL.indexOf('dev-sw.js') !== -1) {
                reg.unregister().catch(function () {});
              }
            });
          }).catch(function () {});

          navigator.serviceWorker
            .register('./sw.js', { scope: './', updateViaCache: 'none' })
            .then(function (reg) {
              reg.update().catch(function () {});
            })
            .catch(function () {});
        }
      });
    </script>
