<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <meta name="application-name" content="SwanArh Classroom" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SwanArh Classroom" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <script>
      window.__pwaDeferredPrompt = null;
      window.__swanarhMounted = false;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaDeferredPrompt = null;
        window.dispatchEvent(new Event('pwa-installed'));
      });

      // Immediately purge any stale Workbox or old version caches on startup
      // (Do NOT wait for window.onload, because if a cached module hangs after 2-3 hours, onload never fires)
      (function () {
        try {
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                if (key !== 'swanarh-classroom-v7') {
                  caches.delete(key).catch(function () {});
                }
              });
            }).catch(function () {});
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              registrations.forEach(function (reg) {
                var scriptURL = (reg.active && reg.active.scriptURL) || (reg.installing && reg.installing.scriptURL) || (reg.waiting && reg.waiting.scriptURL) || '';
                if (scriptURL.indexOf('dev-sw.js') !== -1 || scriptURL.indexOf('workbox') !== -1) {
                  reg.unregister().catch(function () {});
                } else {
                  reg.update().catch(function () {});
                }
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();

      // Self-healing recovery function: clears stale SW/caches and performs a fresh navigation
      window.__swanarhForceRecover = function (manual) {
        try {
          if (!manual) {
            var lastWake = parseInt(sessionStorage.getItem('__swanarh_wake_ts') || '0', 10);
            var now = Date.now();
            if (now - lastWake < 12000) {
              return; // Prevent reload loop if already recovered in the last 12 seconds
            }
            sessionStorage.setItem('__swanarh_wake_ts', String(now));
          } else {
            sessionStorage.removeItem('__swanarh_wake_ts');
          }

          var promises = [];
          if ('serviceWorker' in navigator) {
            promises.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }
          if ('caches' in window) {
            promises.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
            );
          }

          Promise.all(promises).finally(function () {
            var baseUrl = window.location.origin + window.location.pathname;
            window.location.replace(baseUrl + '?wake=' + Date.now());
          });
        } catch (err) {
          window.location.reload();
        }
      };

      // Pre-compiled static bundle loader for GitHub Pages (main branch / root or /docs)
      // When GitHub Pages serves raw repository files without a Vite dev server, browsers cannot execute .tsx directly.
      // This loader immediately boots the pre-compiled production bundle (./gh-pages/app.js & ./gh-pages/app.css).
      window.__staticBundleLoaded = false;
      window.__loadStaticBundle = function () {
        if (window.__swanarhMounted || window.__staticBundleLoaded) return;
        window.__staticBundleLoaded = true;
        try {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './gh-pages/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = './gh-pages/app.js';
          document.body.appendChild(script);
        } catch (e) {}
      };

      // Catch module / chunk load failures that happen when reopening 2-3 hours later or on raw static hosts
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var isChunkOrScriptError =
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('Importing a module script failed') !== -1 ||
          msg.indexOf('ChunkLoadError') !== -1 ||
          (e && e.target && e.target.tagName === 'SCRIPT');
        if (isChunkOrScriptError && !window.__swanarhMounted) {
          if (!window.__staticBundleLoaded) {
            window.__loadStaticBundle();
          } else {
            window.__swanarhForceRecover(false);
          }
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var reason = (e && e.reason) ? String(e.reason.message || e.reason) : '';
        if (
          reason.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          reason.indexOf('Importing a module script failed') !== -1 ||
          reason.indexOf('ChunkLoadError') !== -1
        ) {
          if (!window.__staticBundleLoaded && !window.__swanarhMounted) {
            window.__loadStaticBundle();
          } else {
            window.__swanarhForceRecover(false);
          }
        }
      });

      // Startup Watchdog:
      // 1) At 600ms, if React hasn't mounted yet (e.g. static host serving raw index.html), load pre-built ./gh-pages/app.js in-place.
      // 2) At 2.2s, if React still hasn't mounted, reveal the manual "Tap to Open Now" button so user is never stuck.
      // 3) At 4.5s, if React still hasn't mounted, automatically clear stale SW/caches and wake up the session.
      setTimeout(function () {
        if (!window.__swanarhMounted && !window.__staticBundleLoaded) {
          window.__loadStaticBundle();
        }
      }, 600);

      setTimeout(function () {
        if (!window.__swanarhMounted) {
          var rescueBox = document.getElementById('swanarh-rescue-box');
          if (rescueBox) {
            rescueBox.style.display = 'flex';
          }
        }
      }, 2200);

      setTimeout(function () {
        if (!window.__swanarhMounted) {
          window.__swanarhForceRecover(false);
        }
      }, 4500);

      // Register lightweight icon-only Service Worker after load
      window.addEventListener('load', function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker
            .register('./sw.js', { scope: './', updateViaCache: 'none' })
            .then(function (reg) {
              reg.update().catch(function () {});
            })
            .catch(function () {});
        }
      });
    </script>
    <title>SwanArh Classroom - Dr. Si Thu Aung · Swanarh Academy</title>

    <meta property="og:description" content="Secure online classroom platform with role-based access control, course isolation, anti-piracy watermarked video delivery, interactive classwork feeds, quizzes, and automated certificate generation." />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />

  <body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root">
      <!-- Instant zero-dependency shell with inline vector Academy Crest and self-healing wake button -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; padding: 20px; text-align: center;">
        <div style="width: 76px; height: 76px; border-radius: 999px; background: #ffffff; border: 2px solid #a7f3d0; box-shadow: 0 8px 20px -4px rgba(5, 150, 105, 0.18); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; padding: 4px;">
          <svg viewBox="0 0 400 400" style="width: 100%; height: 100%;" xmlns="http://www.w3.org/2000/svg">
            <circle cx="200" cy="200" r="190" fill="#FFFFFF" stroke="#0f172a" stroke-width="8" />
            <circle cx="200" cy="200" r="130" fill="#FFFFFF" stroke="#059669" stroke-width="5" />
            <path d="M 200,96 L 266,120 L 266,192 C 266,236 200,270 200,270 C 200,270 134,236 134,192 L 134,120 Z" fill="#FFFFFF" stroke="#148823" stroke-width="8" stroke-linejoin="round" />
            <path d="M 196,104 L 142,124 L 142,186 L 196,186 Z" fill="#148823" />
            <path d="M 204,104 L 258,124 L 258,186 L 204,186 Z" fill="#E31E24" />
            <path d="M 142,194 L 196,194 L 196,258 C 176,246 142,222 142,194 Z" fill="#E31E24" />
            <path d="M 204,194 L 258,194 C 258,222 224,246 204,258 Z" fill="#148823" />
          </svg>
        </div>
        <div style="font-size: 18px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">SwanArh Classroom</div>
        <div style="font-size: 11px; font-weight: 700; color: #059669; letter-spacing: 0.06em; margin-top: 2px;">DR. SI THU AUNG · SWANARH ACADEMY</div>
        <div id="swanarh-rescue-box" style="display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; max-width: 280px;">
          <div style="font-size: 12px; color: #475569; line-height: 1.5;">
            ချိတ်ဆက်မှု အသစ်ပြန်လည်ရယူနေပါသည်...
          </div>
          <button
            type="button"
            onclick="window.__swanarhForceRecover && window.__swanarhForceRecover(true)"
            style="background: #059669; color: #ffffff; border: none; border-radius: 12px; padding: 10px 18px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);"
          >
            ချက်ချင်း ပြန်ဖွင့်ရန် (Tap to Open Now)
          </button>
        </div>
      </div>
    </div>
    <script id="vite-entry" type="module" src="./src/main.tsx" onerror="window.__loadStaticBundle && window.__loadStaticBundle()"></script>
    <script>
      // If hosted on GitHub Pages (github.io) or another static host serving raw index.html where #vite-entry still points to .tsx,
      // immediately load the pre-compiled production bundle at 0ms without waiting for .tsx to fail!
      (function () {
        try {
          var entry = document.getElementById('vite-entry');
          var rawTsx = entry && entry.getAttribute('src') && entry.getAttribute('src').indexOf('.tsx') !== -1;
          var host = window.location.hostname || '';
          var isStaticPagesHost =
            host.indexOf('github.io') !== -1 ||
            host.indexOf('pages.dev') !== -1 ||
            host.indexOf('netlify.app') !== -1 ||
            host.indexOf('vercel.app') !== -1;
          if (rawTsx && isStaticPagesHost) {
            if (entry && entry.parentNode) {
              entry.parentNode.removeChild(entry);
            }
            window.__loadStaticBundle();
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
